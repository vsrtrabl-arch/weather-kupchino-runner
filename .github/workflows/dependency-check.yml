name: Python dependency compatibility

on:
  workflow_dispatch:

permissions: {}

jobs:
  dependency-check:
    name: Python ${{ matrix.python-version }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pyswisseph

      - name: Verify imports and Swiss Ephemeris calculation
        run: |
          python - <<'PY'
          from PIL import Image
          import swisseph as swe

          image = Image.new("RGB", (8, 8), "white")
          assert image.size == (8, 8)

          jd = swe.julday(2026, 11, 24, 12.0)
          assert jd > 0

          print("Pillow:", Image.__version__ if hasattr(Image, "__version__") else "import-ok")
          print("Swiss Ephemeris:", swe.version)
          print("Julian day:", jd)
          print("dependencies-ok")
          PY
