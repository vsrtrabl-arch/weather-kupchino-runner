name: Daily digest dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Validate daily digest without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: vsrtrabl-arch/weather-kupchino-daily
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install project dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile daily digest modules
        working-directory: source
        run: |
          python -m py_compile daily_digest.py astrology.py interpretations.py weather.py fact_publisher.py meme_generator.py telegram_client.py config.py

      - name: Run horoscope interpretation unit tests
        working-directory: source
        run: python -m unittest tests.test_refactor_config_and_interpretations -v

      - name: Run daily digest in dry-run mode
        working-directory: source
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          with Path("fact_history.json").open(encoding="utf-8") as file:
              fact_history = json.load(file)
          with Path("meme_history.json").open(encoding="utf-8") as file:
              meme_history = json.load(file)

          fact_dates = set(fact_history.get("reservations", {}))
          meme_dates = set(meme_history.get("reservations", {}))
          common_dates = sorted(fact_dates & meme_dates)
          if not common_dates:
              raise SystemExit("No date has both a reserved fact and a reserved meme.")

          test_date = date.fromisoformat(common_dates[-1])
          print(f"Using latest date with both reservations: {test_date}")

          from daily_digest import run_dry_run
          result = run_dry_run(test_date)

          messages = result["messages"]
          assert len(messages) == 3, f"Expected weather + 2 personal forecasts, got {len(messages)}"
          required_sections = (
              "❤️ Отношения",
              "💼 Работа",
              "💰 Финансы",
              "⚡ Энергия и настроение",
              "🌤 <b>Общий итог дня:</b>",
              "<b>По четырём направлениям:</b>",
              "<b>Главный ориентир:</b>",
          )
          for person, message in zip(("Дарья", "Владимир"), messages[1:]):
              missing = [section for section in required_sections if section not in message]
              if missing:
                  raise SystemExit(f"{person}: missing forecast sections: {missing}")
              print(f"{person}: all four topics and daily summary are present.")

          if not result["fact_message"].strip():
              raise SystemExit("Fact of the day is empty.")
          if not result["meme_caption"].strip():
              raise SystemExit("Meme caption is empty.")
          print("Content structure checks passed; no Telegram publishing or image generation was performed.")
          PY
