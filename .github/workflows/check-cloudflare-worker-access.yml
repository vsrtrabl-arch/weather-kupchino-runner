name: Check existing Cloudflare Worker access

on:
  push:
    paths:
      - ".github/workflows/check-cloudflare-worker-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check existing Cloudflare credentials without exposing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not token or not account:
              raise SystemExit("Existing Cloudflare token/account secret is missing.")

          def get(path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.loads(response.read().decode())
                      return response.status, payload
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.loads(error.read().decode())
                  except Exception:
                      payload = {}
                  return error.code, payload

          status, verify = get("/user/tokens/verify")
          print("TOKEN_VERIFY_HTTP:", status)
          print("TOKEN_VERIFY_STATUS:", verify.get("result", {}).get("status", "unknown"))
          if status != 200 or not verify.get("success"):
              raise SystemExit("The existing Cloudflare token is invalid or cannot be verified.")

          path = f"/accounts/{account}/workers/scripts/weather-kupchino-recovery/settings"
          status, settings = get(path)
          print("WORKER_SETTINGS_HTTP:", status)
          if status == 200 and settings.get("success"):
              result = settings.get("result") or {}
              bindings = result.get("bindings") or []
              print("WORKER_EXISTS: yes")
              print("WORKER_BINDINGS:", json.dumps([
                  {"name": b.get("name"), "type": b.get("type")}
                  for b in bindings
              ], ensure_ascii=False))
              print("WORKER_COMPATIBILITY_DATE:", result.get("compatibility_date", "unknown"))
          elif status == 404:
              print("WORKER_EXISTS: not found in this account or not visible to this token")
          else:
              errors = settings.get("errors") or []
              print("WORKER_SETTINGS_ERRORS:", json.dumps(errors, ensure_ascii=False)[:1500])

          status, schedules = get(f"/accounts/{account}/workers/scripts/weather-kupchino-recovery/schedules")
          print("WORKER_SCHEDULES_HTTP:", status)
          if status == 200 and schedules.get("success"):
              print("WORKER_CRON_SCHEDULES:", json.dumps(
                  schedules.get("result") or [], ensure_ascii=False
              )[:3000])
          else:
              print("WORKER_SCHEDULES_ERRORS:", json.dumps(
                  schedules.get("errors") or [], ensure_ascii=False
              )[:1500])
          PY
