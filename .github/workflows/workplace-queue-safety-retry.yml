name: Workplace Queue Safety Retry

on:
  schedule:
    # Резервная постановка рабочего диалога за 5 минут до отправки.
    # 11:55 Europe/Moscow (UTC+3).
    - cron: "55 8 * * *"

permissions:
  contents: read

concurrency:
  group: workplace-queue-safety-retry
  cancel-in-progress: false

jobs:
  enqueue:
    name: Ensure today's workplace dialogue is queued
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private project source
        uses: actions/checkout@v4
        with:
          repository: vsrtrabl-arch/weather-kupchino-daily
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install project dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate workplace dialogue bank
        working-directory: source
        run: python workplace_publisher.py --validate-all

      - name: Retry today's queue request safely
        working-directory: source
        env:
          WORKPLACE_QUEUE_URL: "https://weather-kupchino-recovery.vsrtrabl.workers.dev/enqueue"
          WORKPLACE_QUEUE_SECRET: ${{ secrets.WORKPLACE_QUEUE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WORKPLACE_QUEUE_SECRET" ]; then
            echo "::error::WORKPLACE_QUEUE_SECRET is not configured."
            exit 1
          fi
          python -c "from workplace_publisher import enqueue_daily_dialogue; print(enqueue_daily_dialogue())"
