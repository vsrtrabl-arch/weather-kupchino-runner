name: Workplace Queue Safety Retry

on:
  schedule:
    # Резервная постановка рабочего диалога за 5 минут до отправки.
    # 11:55 Europe/Moscow (UTC+3).
    - cron: "55 8 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: workplace-queue-safety-retry
  cancel-in-progress: false

jobs:
  enqueue:
    name: Ensure today's workplace dialogue is queued
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm today's main digest was published
        id: digest
        uses: actions/github-script@v7
        with:
          script: |
            const timezone = "Europe/Moscow";
            const moscowDate = (value) => new Intl.DateTimeFormat("en-CA", {
              timeZone: timezone,
              year: "numeric", month: "2-digit", day: "2-digit",
            }).format(value);
            const today = moscowDate(new Date());
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "daily-production.yml",
              per_page: 100,
            });
            const runs = response.data.workflow_runs.filter((run) =>
              run.id !== context.runId &&
              moscowDate(new Date(run.created_at)) === today
            );
            for (const run of runs) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const published = jobs.data.jobs.some((job) =>
                job.steps?.some((step) =>
                  step.name === "Publish daily digest" && step.conclusion === "success"
                )
              );
              if (published) {
                core.info(`Today's main digest was published in run ${run.id}; queue retry is allowed.`);
                core.setOutput("published", "true");
                return;
              }
            }
            core.warning("No successful main digest publication found for today; workplace queue retry is skipped.");
            core.setOutput("published", "false");

      - name: Checkout private project source
        if: ${{ steps.digest.outputs.published == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: vsrtrabl-arch/weather-kupchino-daily
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.11
        if: ${{ steps.digest.outputs.published == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install project dependencies
        if: ${{ steps.digest.outputs.published == 'true' }}
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate workplace dialogue bank
        if: ${{ steps.digest.outputs.published == 'true' }}
        working-directory: source
        run: python workplace_publisher.py --validate-all

      - name: Retry today's queue request safely
        if: ${{ steps.digest.outputs.published == 'true' }}
        working-directory: source
        env:
          WORKPLACE_QUEUE_URL: "https://weather-kupchino-recovery.vsrtrabl.workers.dev/enqueue"
          WORKPLACE_QUEUE_SECRET: ${{ secrets.WORKPLACE_QUEUE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WORKPLACE_QUEUE_SECRET" ]; then
            echo "::error::WORKPLACE_QUEUE_SECRET is not configured."
            exit 1
          fi
          python -c "from workplace_publisher import enqueue_daily_dialogue; print(enqueue_daily_dialogue())"
