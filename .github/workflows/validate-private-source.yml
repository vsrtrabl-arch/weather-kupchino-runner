name: Validate Private Source Tests (public runner)

# The PR validates the same-named private source branch without running production publishing jobs.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Ветка, тег или commit закрытого репозитория (по умолчанию main)"
        required: false
        default: "feature/planet-fact-1300-minimal"
        type: string

permissions:
  contents: read

concurrency:
  group: private-source-validation
  cancel-in-progress: false

jobs:
  test:
    name: Validate private project source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private project source
        uses: actions/checkout@v4
        with:
          repository: vsrtrabl-arch/weather-kupchino-daily
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || 'main') || github.head_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install project dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile production and Planet fact modules
        working-directory: source
        run: |
          python -m py_compile \
            daily_digest.py \
            fact_preparer.py \
            fact_publisher.py \
            fact_queue_publisher.py \
            reserve_fact.py
          node --check cloudflare-recovery/worker.js

      - name: Run all source unit tests
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee ../source-test-results.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-source-test-results-${{ github.run_id }}
          path: source-test-results.log
          if-no-files-found: warn
          retention-days: 14
