name: Runner smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke-test:
    name: Check hosted Python runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check runner
        run: |
          echo "GitHub-hosted runner is available"
          python3 --version
          python3 -c "print('runner-ok')"
