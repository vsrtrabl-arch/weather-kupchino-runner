name: Publish Fun Day Post (public runner)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Разрешить отправку календарной публикации в Telegram"
        required: true
        default: false
        type: boolean
      target_date:
        description: "Дата выпуска YYYY-MM-DD (пусто — текущая дата Москвы)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-channel-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate queued fun-day post (no Telegram send)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private project source
        uses: actions/checkout@v4
        with:
          repository: vsrtrabl-arch/weather-kupchino-daily
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate queued post and delivery ledger (no Telegram send)
        working-directory: source
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          WORKPLACE_QUEUE_SECRET: ${{ secrets.WORKPLACE_QUEUE_SECRET }}
          QUIZ_WORKER_URL: ${{ secrets.QUIZ_WORKER_URL }}
          QUIZ_SYNC_SECRET: ${{ secrets.QUIZ_SYNC_SECRET }}
        run: |
          python -m py_compile fun_day_calendar.py fun_day_preparer.py fun_day_publisher.py delivery_ledger.py
          if [ -n "$TARGET_DATE" ]; then
            python fun_day_publisher.py --dry-run --date "$TARGET_DATE"
          else
            python fun_day_publisher.py --dry-run
          fi
          python - <<'PY'
          import os
          from delivery_ledger import DeliveryLedger
          DeliveryLedger().preflight("@WeatherKupchino")
          print("Preflight passed: D1 delivery ledger is ready.")
          PY

  publish:
    name: Publish one confirmed fun-day post
    needs: preflight
    if: ${{ inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private project source
        uses: actions/checkout@v4
        with:
          repository: vsrtrabl-arch/weather-kupchino-daily
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: source
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Publish queued fun-day post
        working-directory: source
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKPLACE_QUEUE_SECRET: ${{ secrets.WORKPLACE_QUEUE_SECRET }}
          QUIZ_WORKER_URL: ${{ secrets.QUIZ_WORKER_URL }}
          QUIZ_SYNC_SECRET: ${{ secrets.QUIZ_SYNC_SECRET }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python fun_day_publisher.py --publish --date "$TARGET_DATE"
          else
            python fun_day_publisher.py --publish
          fi
